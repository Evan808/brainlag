<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brain Lag</title>
  <meta name="description" content="A two-minute working-memory workout: always answer the problem from N steps ago.">
  <meta name="theme-color" content="#34BEED">
  <meta property="og:title" content="Brain Lag">
  <meta property="og:description" content="A two-minute working-memory workout: always answer the problem from N steps ago.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='26' height='26' rx='4' fill='%231A1A1A'/%3E%3Crect x='1' y='1' width='26' height='26' rx='4' fill='%2334BEED' stroke='%231A1A1A' stroke-width='2'/%3E%3Ctext x='14' y='21' font-family='monospace' font-weight='bold' font-size='16' text-anchor='middle' fill='%230B3A4F'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/mplusrounded1c-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dotgothic16-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <div class="window" id="window">

    <header class="titlebar">
      <span class="titlebar-name">BRAIN_LAG.EXE</span>
      <div class="titlebar-btns">
        <button class="tb-btn" id="btn-sound" type="button" aria-pressed="false" aria-label="Sound" title="Sound">
          <svg class="sound-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 6l3 4M14.5 6l-3 4"/></svg>
          <svg class="sound-on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg>
        </button>
        <button class="tb-btn" id="btn-help" type="button" aria-label="Why this game" title="Why this game">?</button>
        <button class="tb-btn" id="btn-close" type="button" aria-label="Back to levels" title="Back to levels" hidden>×</button>
      </div>
    </header>

    <main class="window-body">

      <!-- Intro: why play -->
      <section class="view" id="view-intro" hidden>
        <div class="screen screen--grow intro-screen">
          <p class="intro-step" id="intro-step"></p>
          <h1 class="intro-title" id="intro-title"></h1>
          <p class="intro-text" id="intro-text"></p>
        </div>
        <div class="dots" id="intro-dots"></div>
        <div class="btn-row">
          <button class="btn" id="intro-skip" type="button">Skip</button>
          <button class="btn btn--primary" id="intro-next" type="button">Next</button>
        </div>
      </section>

      <!-- Level select -->
      <section class="view" id="view-menu" hidden>
        <div class="screen">
          <div class="menu-head">
            <p class="menu-title">BRAIN LAG</p>
            <p class="menu-sub">ANSWER THE PROBLEM FROM N STEPS AGO</p>
          </div>
          <ul class="tracks" id="tracks"></ul>
        </div>
        <div class="menu-foot">
          <button class="btn" id="menu-why" type="button">Why play</button>
          <button class="btn btn--silver" id="menu-tutorial" type="button">Tutorial</button>
        </div>
      </section>

      <!-- Game -->
      <section class="view" id="view-game" hidden>
        <div class="screen screen--grow">
          <div class="screen-status">
            <span id="status"></span>
            <span class="timer" id="timer">00:00</span>
          </div>
          <div class="stack" id="stack" aria-live="polite"></div>
        </div>
        <div class="coach" id="coach" hidden><span class="coach-arrow" id="coach-arrow">▲</span><span id="coach-text"></span></div>
        <div class="progress">
          <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width: 0%"></div></div>
          <span class="progress-label" id="progress-label">0/20</span>
        </div>
        <div class="keypad" id="keypad">
          <button class="key" data-key="1" type="button">1</button>
          <button class="key" data-key="2" type="button">2</button>
          <button class="key" data-key="3" type="button">3</button>
          <button class="key" data-key="4" type="button">4</button>
          <button class="key" data-key="5" type="button">5</button>
          <button class="key" data-key="6" type="button">6</button>
          <button class="key" data-key="7" type="button">7</button>
          <button class="key" data-key="8" type="button">8</button>
          <button class="key" data-key="9" type="button">9</button>
          <button class="key key--silver key--word" data-key="retry" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2v3h3"/></svg>Retry
          </button>
          <button class="key" data-key="0" type="button">0</button>
          <button class="key key--primary key--word" data-key="action" id="key-action" type="button">Next</button>
        </div>
      </section>

      <!-- Results -->
      <section class="view" id="view-results" hidden>
        <div class="screen result-screen">
          <p class="result-level" id="res-level"></p>
          <p class="result-score"><span id="res-correct"></span><small id="res-total"></small></p>
          <p class="result-time" id="res-time"></p>
          <div class="result-strip" id="res-strip" aria-hidden="true"></div>
          <span class="badge" id="res-badge" hidden>new best</span>
          <p class="result-line" id="res-line"></p>
        </div>
        <div class="btn-row">
          <button class="btn btn--primary" id="res-again" type="button">Again</button>
          <button class="btn" id="res-levels" type="button">Levels</button>
        </div>
      </section>

    <!-- Pause + quit confirm cover the window body, title bar stays visible -->
    <div class="overlay" id="overlay-pause" hidden>
      <div class="overlay-card">
        <p class="overlay-title">Paused</p>
        <p class="overlay-text">The stack is covered while you're away. The timer is stopped.</p>
        <button class="btn btn--primary" id="pause-resume" type="button">Resume</button>
      </div>
    </div>
    <div class="overlay" id="overlay-quit" hidden>
      <div class="overlay-card">
        <p class="overlay-title">Quit round?</p>
        <p class="overlay-text">This round won't be saved.</p>
        <div class="btn-row">
          <button class="btn btn--primary" id="quit-stay" type="button">Keep going</button>
          <button class="btn" id="quit-leave" type="button">Quit</button>
        </div>
      </div>
    </div>

    </main>

  </div>
</div>
<script src="game.js"></script>
</body>
</html>
